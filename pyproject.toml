[project]
name = "linkedin-profile-scraper-public-api"
version = "0.1.0"
description = "Hosted API returning a LinkedIn profile as structured JSON, via LinkedIn's internal Voyager API."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "curl-cffi>=0.7",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
